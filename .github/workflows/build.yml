name: Build and Release AMVG V10 Free

on:
  push:
    tags:
      - 'v*' # "v1.0.0" などのバージョンタグをPushした時に自動稼働する設定

permissions:
  contents: write # Releaseを作成・アップロードするための権限

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        # --noconsole : 起動時の黒いコマンドプロンプト画面を隠蔽
        # --onedir    : 起動速度を優先し、単一ファイルではなくフォルダ形式で出力
        # --add-data  : UIとプリセットデータを内部に梱包
        pyinstaller --name "AMVG_V10_Free" --noconfirm --onedir --noconsole --add-data "index.html;." --add-data "ai_filters.json;." main.py

    - name: Create Release ZIP
      run: |
        # ユーザーに配布しやすいよう、出力されたフォルダを丸ごとZIP圧縮
        Compress-Archive -Path dist\AMVG_V10_Free -DestinationPath AMVG_V10_Free_Windows.zip

    - name: Publish Release
      uses: softprops/action-gh-release@v2
      with:
        files: AMVG_V10_Free_Windows.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
